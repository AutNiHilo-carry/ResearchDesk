name: Offline verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DEEPSEEK_API_KEY: ""
      TAVILY_API_KEY: ""
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked runtime and test dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Install project
        id: install
        run: python -m pip install --no-deps -e .
      - name: Check dependency consistency
        run: python -m pip check
      - name: Prepare artifact directories
        run: New-Item -ItemType Directory -Path artifacts,runs -Force | Out-Null
      - name: Full offline regression
        run: python -m pytest -q --junitxml=artifacts/pytest.xml --basetemp=runs/ci-pytest
      - name: Collect process-kill recovery evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $matrix = @(Get-ChildItem -LiteralPath runs/ci-pytest -Directory -Filter 'test_scripted_full_cli_kill_*' | Where-Object { $_.Name -match '^test_scripted_full_cli_kill_.*[0-9]+$' } | ForEach-Object { Join-Path $_.FullName 'matrix' })
          if ($matrix.Count -ne 1) { throw "Expected one numbered scripted recovery matrix, found $($matrix.Count)" }
          New-Item -ItemType Directory -Path artifacts/recovery-matrix -Force | Out-Null
          foreach ($name in @('result.json', 'summary.md')) {
            Copy-Item -LiteralPath (Join-Path $matrix[0] $name) -Destination (Join-Path artifacts/recovery-matrix $name)
          }
      - name: Collect model-response gap evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gap = @(Get-ChildItem -LiteralPath runs/ci-pytest -Directory -Filter 'test_model_return_gap_is_*' | Where-Object { $_.Name -match '^test_model_return_gap_is_.*[0-9]+$' } | ForEach-Object { Join-Path $_.FullName 'gap' })
          if ($gap.Count -ne 1) { throw "Expected one numbered model-response gap experiment, found $($gap.Count)" }
          New-Item -ItemType Directory -Path artifacts/model-response-gap -Force | Out-Null
          foreach ($name in @('result.json', 'summary.md')) {
            Copy-Item -LiteralPath (Join-Path $gap[0] $name) -Destination (Join-Path artifacts/model-response-gap $name)
          }
      - name: Fixed-fixture mechanism acceptance
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m researchdesk.acceptance_demo --output runs/ci-acceptance
      - name: Build distribution wheel
        run: python -m pip wheel --no-deps --wheel-dir artifacts/wheel .
      - name: Check installed wheel outside source checkout
        run: |
          $ErrorActionPreference = 'Stop'
          $wheelEnv = Join-Path $env:RUNNER_TEMP 'researchdesk-wheel-env'
          $wheelOutput = Join-Path $env:RUNNER_TEMP 'researchdesk-wheel-smoke'
          if ((Test-Path -LiteralPath $wheelEnv) -or (Test-Path -LiteralPath $wheelOutput)) { throw 'Expected fresh wheel environment and output' }
          $wheels = @(Get-ChildItem -LiteralPath artifacts/wheel -File -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly one wheel' }
          python -m venv $wheelEnv
          if ($LASTEXITCODE -ne 0) { throw 'Wheel venv creation failed' }
          $wheelPython = Join-Path $wheelEnv 'Scripts/python.exe'
          & $wheelPython -m pip install -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Wheel dependencies failed' }
          & $wheelPython -m pip install --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Wheel installation failed' }
          & $wheelPython -I -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Wheel dependency check failed' }
          & $wheelPython -I scripts/smoke_wheel.py --wheel $wheels[0].FullName --output $wheelOutput
          if ($LASTEXITCODE -ne 0) { throw 'Wheel smoke failed' }
          New-Item -ItemType Directory -Path artifacts/wheel-smoke -Force | Out-Null
          foreach ($name in @('result.json', 'summary.md')) {
            Copy-Item -LiteralPath (Join-Path $wheelOutput $name) -Destination (Join-Path artifacts/wheel-smoke $name)
          }
      - name: Upload verification results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: offline-verification-windows-py311
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/pytest.xml
            artifacts/wheel/*.whl
            artifacts/wheel-smoke/result.json
            artifacts/wheel-smoke/summary.md
            artifacts/model-response-gap/result.json
            artifacts/model-response-gap/summary.md
            artifacts/recovery-matrix/result.json
            artifacts/recovery-matrix/summary.md
            runs/ci-acceptance/summary.md
            runs/ci-acceptance/result.json
            runs/ci-acceptance/fixture-quality.json
