name: Offline verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DEEPSEEK_API_KEY: ""
      TAVILY_API_KEY: ""
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked runtime and test dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Install project
        id: install
        run: python -m pip install --no-deps -e .
      - name: Check dependency consistency
        run: python -m pip check
      - name: Prepare artifact directories
        run: New-Item -ItemType Directory -Path artifacts,runs -Force | Out-Null
      - name: Full offline regression
        run: python -m pytest -q --junitxml=artifacts/pytest.xml --basetemp=runs/ci-pytest
      - name: Fixed-fixture mechanism acceptance
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m researchdesk.acceptance_demo --output runs/ci-acceptance
      - name: Upload verification results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: offline-verification-windows-py311
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/pytest.xml
            runs/ci-acceptance/summary.md
            runs/ci-acceptance/result.json
            runs/ci-acceptance/fixture-quality.json
